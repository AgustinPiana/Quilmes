name: Actualizar datos

on:
  schedule:
    # Horarios en UTC → en Argentina: 22:00, 00:00, 09:00, 13:00, 17:00 y 20:00.
    - cron: '0 1,3,12,16,20,23 * * *'
  workflow_dispatch: # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar navegador para hockey
        run: npx playwright install --with-deps chromium

      - name: Juntar datos
        run: npm run update

      - name: Guardar cambios
        run: |
          if git diff --quiet -- public/data; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Datos actualizados $(TZ=America/Argentina/Buenos_Aires date '+%d/%m %H:%M')"
          git push
